name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm@11.2.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check signing secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [[ -z "${KEYSTORE_B64}" || "${KEYSTORE_B64}" == "" ]]; then
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::KEYSTORE_B64 not set, will build debug APK"
          else
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "Signing keystore configured"
          fi

      - name: Restore signing keystore
        if: steps.keystore.outputs.has_signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          OPENCLAW_ANDROID_STORE_FILE=$(pwd)/release.keystore
          OPENCLAW_ANDROID_STORE_PASSWORD=$KEYSTORE_PASSWORD
          OPENCLAW_ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS
          OPENCLAW_ANDROID_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Generate build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build APK
        id: build_step
        env:
          OPENCLAW_BUILD_COMMIT: ${{ github.sha }}
          OPENCLAW_BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.value }}
        run: |
          if [[ "${{ steps.keystore.outputs.has_signing }}" == "true" ]]; then
            node scripts/run-android-gradle.mjs \
              -PopenclawBuildCommit="$OPENCLAW_BUILD_COMMIT" \
              -PopenclawBuildTimestamp="$OPENCLAW_BUILD_TIMESTAMP" \
              :app:assembleThirdPartyRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          else
            node scripts/run-android-gradle.mjs \
              :app:assembleThirdPartyDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          echo "=== KOTLIN COMPILATION ERRORS ==="
          grep -i "error:\|unresolved\|cannot find\|not found\|e: " /tmp/build.log | head -30 || echo "No errors found"

      - name: Fail if build failed
        if: steps.build_step.outputs.exit_code != '0'
        run: exit 1

      - name: Locate and verify APK
        id: apk
        run: |
          echo "=== All APK files found ==="
          find apps/android -name "*.apk" -type f -exec ls -la {} \; 2>/dev/null
          APK=$(find apps/android/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [[ -z "$APK" ]]; then
            APK=$(find apps/android -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [[ -z "$APK" ]]; then
            echo "::error::No APK file found!"
            exit 1
          fi
          echo "Found: $APK ($(stat -c%s "$APK") bytes)"
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="${{ steps.apk.outputs.path }}"
          APK_NAME="$(basename $APK)"
          
          gh release create "$TAG" \
            --title "$APK_NAME" \
            --notes "Android APK build" 2>&1 || true
          
          sleep 2
          gh release upload "$TAG" "$APK#$APK_NAME" --clobber 2>&1
          gh release view "$TAG" --json assets 2>&1
