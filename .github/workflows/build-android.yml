name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install -g pnpm@11.2.2
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check signing secrets
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [[ -z "${KEYSTORE_B64}" || "${KEYSTORE_B64}" == "" ]]; then
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::KEYSTORE_B64 not set, will build debug APK"
          else
            echo "has_signing=true" >> $GITHUB_OUTPUT
          fi
      - name: Restore signing keystore
        if: steps.keystore.outputs.has_signing == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          OPENCLAW_ANDROID_STORE_FILE=$(pwd)/release.keystore
          OPENCLAW_ANDROID_STORE_PASSWORD=$KEYSTORE_PASSWORD
          OPENCLAW_ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS
          OPENCLAW_ANDROID_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD
          EOF
      - name: Generate build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      - name: Build APK
        id: build_step
        env:
          OPENCLAW_BUILD_COMMIT: ${{ github.sha }}
          OPENCLAW_BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.value }}
        run: |
          if [[ "${{ steps.keystore.outputs.has_signing }}" == "true" ]]; then
            node scripts/run-android-gradle.mts \
              -PopenclawBuildCommit="$OPENCLAW_BUILD_COMMIT" \
              -PopenclawBuildTimestamp="$OPENCLAW_BUILD_TIMESTAMP" \
              :app:assembleThirdPartyRelease --no-daemon --stacktrace
          else
            node scripts/run-android-gradle.mts \
              :app:assembleThirdPartyDebug --no-daemon --stacktrace
          fi
      - name: Locate and verify APK
        id: apk
        run: |
          APK=$(find apps/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          if [[ -z "$APK" ]]; then
            echo "::error::No APK found in outputs/apk directory"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK")
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "::notice::APK found: $APK ($APK_SIZE bytes)"
      - name: Upload APK as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7
      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="${{ steps.apk.outputs.path }}"
          gh release create "$TAG" --title "$(basename $APK)" --notes "Android APK build" || true
          sleep 2
          gh release upload "$TAG" "$APK" --clobber

      - name: Publish version.json to meta branch
        # 对齐 sanyelive / FeiNiuMusic: 应用内"检查更新"经 jsDelivr @meta 兜底, 国内稳达.
        # 每次发版把最新版本信息写回 meta 分支 (独立于 main, 不被 upstream 覆盖).
        # 用 git clone meta + 写文件 + push (GITHUB_TOKEN 对 git push 有权限, 比 gh api PUT 可靠).
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VNO_V="${TAG#v}"
          VERSION_NAME="${VNO_V}"
          # versionCode 从 Version.properties 读取, 与 gradle 编译 APK 用的值完全一致
          # (避免自行拼接格式不一致导致 INSTALL_FAILED_VERSION_DOWNGRADE)
          VERSION_CODE=$(grep 'OPENCLAW_ANDROID_VERSION_CODE' apps/android/Config/Version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASE_URL="https://github.com/aqiyoung/openclaw/releases/tag/${TAG}"
          DL_BASE="https://github.com/aqiyoung/openclaw/releases/download/${TAG}/openclaw-${VERSION_NAME}-thirdParty-release"
          export TAG VERSION_NAME VERSION_CODE RELEASE_URL DL_BASE
          WORK=/tmp/meta-publish
          rm -rf "$WORK"
          git clone --depth 1 --branch meta "https://x-access-token:${GH_TOKEN}@github.com/aqiyoung/openclaw.git" "$WORK"
          cd "$WORK"
          python3 - <<'PYEOF'
          import json, os, subprocess
          tag = os.environ['TAG']
          version_name = os.environ['VERSION_NAME']
          code = int(os.environ['VERSION_CODE'])
          release_url = os.environ['RELEASE_URL']
          dl_base = os.environ['DL_BASE']
          # 国内可达: APK 直链烤上 gh-proxy 前缀, 复制后粘到浏览器即可下.
          proxy = "https://gh-proxy.com/"
          data = {
              "tag": tag,
              "versionName": version_name,
              "versionCode": code,
              "releaseName": tag,
              "apk": {
                  "arm64-v8a": f"{proxy}{dl_base}-arm64-v8a.apk",
                  "armeabi-v7a": f"{proxy}{dl_base}-armeabi-v7a.apk",
                  "x86_64": f"{proxy}{dl_base}-x86_64.apk",
              },
              "releaseUrl": release_url,
              "critical": False,
              "notes": f"OpenClaw {tag} 已发布, 详情见 GitHub Releases",
              "updatedAt": subprocess.run(["date", "-u", "+%Y-%m-%d"], capture_output=True, text=True).stdout.strip(),
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("version.json written for", tag)
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "no change, skip push"
          else
            git commit -m "chore: bump version.json to ${TAG}"
            git push
            echo "✅ version.json -> meta 已更新 to ${TAG}"
          fi
